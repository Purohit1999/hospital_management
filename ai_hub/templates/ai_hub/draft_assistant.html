{% extends "hospital/homebase.html" %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-3">Discharge Summary Draft Assistant</h2>
  <form method="post" id="draft-form">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Doctor Notes</label>
      <textarea class="form-control" name="notes" rows="6"></textarea>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="redact" id="redact">
      <label class="form-check-label" for="redact">PII Redaction</label>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="reviewed" id="reviewed">
      <label class="form-check-label" for="reviewed">Reviewed</label>
    </div>
    <button type="submit" class="btn btn-primary">Generate Draft</button>
  </form>

  <div class="alert alert-warning mt-3 d-none" id="draft-error"></div>

  <div class="alert alert-info mt-3 d-none" id="draft-status">
    Generating draft… Please wait.
  </div>
  <div class="spinner-border text-primary d-none" role="status" id="draft-spinner">
    <span class="visually-hidden">Loading...</span>
  </div>

  <div class="mt-4 d-none" id="draft-output">
    <h5>Draft Summary</h5>
    <pre id="draft-text"></pre>
    <div class="mt-3">
      <h5>Patient Instructions</h5>
      <pre id="instructions-text"></pre>
    </div>
  </div>

  <div class="mt-3 text-muted small d-none" id="request-id"></div>
</div>

<script>
  (function () {
    const form = document.getElementById("draft-form");
    const statusEl = document.getElementById("draft-status");
    const spinnerEl = document.getElementById("draft-spinner");
    const errorEl = document.getElementById("draft-error");
    const outputEl = document.getElementById("draft-output");
    const draftEl = document.getElementById("draft-text");
    const instructionsEl = document.getElementById("instructions-text");
    const requestIdEl = document.getElementById("request-id");

    const showError = (message) => {
      errorEl.textContent = message;
      errorEl.classList.remove("d-none");
      statusEl.classList.add("d-none");
      spinnerEl.classList.add("d-none");
    };

    const startPolling = (statusUrl) => {
      const poll = () => {
        fetch(statusUrl)
          .then((res) => {
            if (!res.ok) {
              throw new Error("Bad response");
            }
            return res.json();
          })
          .then((data) => {
            if (data.state === "finished") {
              const result = data.result || {};
              draftEl.textContent = result.draft || "";
              instructionsEl.textContent = result.instructions || "";
              outputEl.classList.remove("d-none");
              statusEl.textContent = "Draft ready.";
              spinnerEl.classList.add("d-none");
              return;
            }
            if (data.state === "failed") {
              showError(data.error || "Draft generation failed.");
              return;
            }
            if (data.state === "not_found") {
              showError("Draft job expired. Please retry.");
              return;
            }
            setTimeout(poll, 1500);
          })
          .catch(() => {
            showError("Unable to fetch draft status. Please retry.");
          });
      };
      poll();
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      errorEl.classList.add("d-none");
      statusEl.classList.remove("d-none");
      spinnerEl.classList.remove("d-none");
      outputEl.classList.add("d-none");
      requestIdEl.classList.add("d-none");
      const formData = new FormData(form);
      fetch("{% url 'ai-draft' %}", {
        method: "POST",
        headers: { "X-CSRFToken": formData.get("csrfmiddlewaretoken") },
        body: formData,
      })
        .then((res) => {
          if (!res.ok) {
            throw new Error("Bad response");
          }
          return res.json();
        })
        .then((data) => {
          if (!data || !data.request_id || !data.status_url) {
            showError("Unable to start draft. Please retry.");
            return;
          }
          requestIdEl.textContent = "Request ID: " + data.request_id;
          requestIdEl.classList.remove("d-none");
          startPolling(data.status_url);
        })
        .catch(() => {
          showError("Unable to start draft. Please retry.");
        });
    });
  })();
</script>
{% endblock %}
